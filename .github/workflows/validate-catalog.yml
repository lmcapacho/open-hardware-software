name: Validate Catalog

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.json'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/validate-catalog.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate catalog data and links
        run: python scripts/validate_catalog.py --report catalog-validation.json

      - name: Create or update validation issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: catalog-validation.json
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            const marker = '<!-- catalog-health:validation -->';
            const title = 'Catalog validation report';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && issue.body?.includes(marker));
            const lines = [marker, `Validated ${report.tool_count} tools.`];
            for (const issue of report.structural_issues) {
              lines.push(`- **${issue.tool}** \`${issue.field}\`: ${issue.message}`);
            }
            for (const issue of report.link_issues) {
              lines.push(`- **${issue.tool}** \`${issue.field}\`: ${issue.message} (${issue.url})`);
            }
            for (const warning of report.link_warnings) {
              lines.push(`- Warning: **${warning.tool}** \`${warning.field}\`: ${warning.message} (${warning.url})`);
            }
            const body = lines.join('\n');
            if (!report.has_errors) {
              if (existing?.state === 'open') {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', body: `${body}\n\nResolved by the latest scheduled validation.` });
              }
              return;
            }
            if (existing?.state === 'open') {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
