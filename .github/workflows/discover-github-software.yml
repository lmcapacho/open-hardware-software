name: Discover Software

on:
  schedule:
    - cron: '47 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Find catalog candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/discover_github_software.py --report github-software-candidates.json

      - name: Create or update discovery issue
        uses: actions/github-script@v9
        env:
          REPORT_FILE: github-software-candidates.json
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            const marker = '<!-- catalog-health:github-discovery -->';
            const title = 'Catalog software discovery review';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && issue.body?.includes(marker));
            const lines = [
              marker,
              `Searched GitHub, GitLab, and Codeberg for maintained, end-user circuit-simulation applications with an open-source license, at least ${report.minimum_stars} stars, activity during the last ${report.active_within_days} days, and a recent stable release.`,
              '',
              'Review each candidate before adding it to `index.json`.'
            ];
            for (const candidate of report.candidates) {
              lines.push(`- [**${candidate.name}**](${candidate.url}) (${candidate.license}, ${candidate.version}, released ${candidate.release_date}, ${candidate.stars} stars; sources: ${candidate.sources.join(', ')}; queries: ${candidate.topics.join(', ')}) — ${candidate.description}`);
            }
            for (const error of report.errors) {
              lines.push(`- ${error.source || 'GitHub'} search failed for \`${error.topic}\`: ${error.message}`);
            }
            const body = lines.join('\n');
            if (report.candidates.length === 0 && report.errors.length === 0) {
              if (existing?.state === 'open') {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', body: `${body}\n\nResolved by the latest discovery run.` });
              }
              return;
            }
            if (existing?.state === 'open') {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
